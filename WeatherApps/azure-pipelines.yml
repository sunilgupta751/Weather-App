trigger:
- dev

variables:
- group: Variable_Group_Rabbit_Mq_Password   # variable group for secrets like rabbitmqPassword
- name: imageName
  value: 'weatherapp'
- name: acrName
  value: 'acrlearn001.azurecr.io'
- name: acr_serviceconnection
  value: 'weatherapp-service-connection'
- name: sshServiceConnection
  value: 'ssh-service-connection'
- name: vmAppPath
  value: '/home/ubuntu/weatherapp'

stages:
- stage: Build
  jobs:
  - job: BuildAndPush
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - task: Docker@2
      inputs:
        command: buildAndPush
        repository: '$(imageName)'
        dockerFile: '**/Dockerfile'
        containerRegistry: $(acr_serviceconnection)
        tags: |
          $(Build.BuildId)
          latest

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployToVM
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: SSH@0
      inputs:
        sshEndpoint: $(sshServiceConnection)
        runOptions: commands
        commands: |
          mkdir -p $(vmAppPath)
          cd $(vmAppPath)

          export rabbitmqPassword=$(rabbitmqPassword)

          docker pull $(acrName)/$(imageName):$(Build.BuildId)

          docker-compose down || true
          docker-compose up -d

trigger:
- dev

variables:
- group: Variable_Group_Rabbit_Mq_Password   # variable group for secrets like rabbitmqPasswordd
- group: service_principle_credentials 
- name: imageName
  value: 'weatherapp'
- name: acrName
  value: 'acrlearn001.azurecr.io'
- name: acrserviceconnection
  value: 'acr_serviceconnection'
- name: sshServiceConnection
  value: 'ssh-service-connection'
- name: vmAppPath
  value: '/home/azureuser/weatherapp'
# ==============================
# BUILD STAGE
# ==============================
stages:
- stage: Build
  jobs:
  - job: BuildAndPush
    pool:
      name: 'SelfHosted-AgentPool'
    steps:
    - checkout: self
    - task: Docker@2
      inputs:
        command: buildAndPush
        containerRegistry: '$(acrserviceconnection)'
        repository: '$(imageName)'
        dockerFile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
# ==============================
# DEPLOY STAGE
# ==============================
- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployToVM
    pool:
      name: 'SelfHosted-AgentPool'
    steps:
     # Ensure target folder exists
    - task: SSH@0
      inputs:
        sshEndpoint: $(sshServiceConnection)
        runOptions: commands
        commands: |
          mkdir -p $(vmAppPath)
          cd $(vmAppPath)
      # Copy docker-compose.yml to VM
    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: $(sshServiceConnection)
        sourceFolder: '$(System.DefaultWorkingDirectory)/WeatherApps'
        contents: '**/docker-compose.yml'
        targetFolder: '$(vmAppPath)' 
        flatten: true
      # Deploy using Docker Compose
    - task: SSH@0
      inputs:
        sshEndpoint: $(sshServiceConnection)
        runOptions: commands
        failOnStdErr: false
        commands: |
          cd $(vmAppPath)  
          
          # Login to ACR using SP (Service Principal)
          echo $(acrServicePrincipalSecreteVal) | docker login $(acrName) -u $(acrServicePrincipalClientId) --password-stdin
                   
          export IMAGE_TAG=$(Build.BuildId)
          docker compose pull
          docker compose down || true
          docker compose up -d --remove-orphans
